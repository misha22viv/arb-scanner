name: ARB core tests
on:
  push:
    branches:
      - feature/fonbet-winline-prematch
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test canonical matching and arbitrage calculations
        run: node test/arb-core.test.js
